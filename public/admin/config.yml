backend:
  name: github
  repo: rohangandhi05/Personal-Website-v5
  branch: astro
  base_url: https://rohanxg.vercel.app
  auth_endpoint: /api/auth

# Body images are stored in public/ so they resolve as static URLs in the build
media_folder: public/assets/uploads
public_folder: /assets/uploads

collections:
  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    format: frontmatter
    extension: mdx
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string }
      - label: Publish Date
        name: pubDate
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss.SSSZ'
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm'
      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
        hint: Used to filter posts on the Blog page.
      - { label: Draft, name: draft, widget: boolean, default: false }
      - label: Body
        name: body
        widget: markdown
        hint: >-
          Math (LaTeX/KaTeX): $...$ inline, $$...$$ block. Switch the editor
          to Markdown mode when writing equations.

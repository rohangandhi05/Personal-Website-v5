backend:
  name: github
  repo: rohangandhi05/Personal-Website-v5
  branch: astro
  base_url: https://rohanxg.vercel.app
  auth_endpoint: /api/auth

app_title: The Writing Desk
site_url: https://rohanxg.vercel.app
logo:
  src: /admin/logo.svg

# Body images are stored in public/ so they resolve as static URLs in the build
media_folder: public/assets/uploads
public_folder: /assets/uploads
media_libraries:
  default:
    config:
      # Keep upload filenames lowercase and hyphenated, as Decap did
      slugify_filename: true

collections:
  - name: blog
    label: Blog Posts
    label_singular: Post
    folder: src/content/blog
    create: true
    format: frontmatter
    extension: md
    slug: '{{slug}}'
    preview_path: post/{{slug}}/
    sortable_fields: [pubDate, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: string }
      - label: Publish Date
        name: pubDate
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss.SSSZ'
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm'
      - label: Tags
        name: tags
        widget: list
        required: false
        default: []
        hint: Used to filter posts on the Blog page.
      - { label: Draft, name: draft, widget: boolean, default: false }
      - label: Body
        name: body
        widget: markdown
        # Markdown mode first: the rich text editor can rewrite LaTeX
        modes: [raw, rich_text]
        hint: >-
          Math (LaTeX/KaTeX): $...$ inline, $$...$$ block. Stay in Markdown
          mode when a post has equations.

  - name: snippets
    label: Snippets
    label_singular: Snippet
    folder: src/content/snippets
    create: true
    format: frontmatter
    extension: md
    # Titles are optional, so files are named by date
    slug: '{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}'
    preview_path: snippets/
    sortable_fields: [pubDate]
    fields:
      - label: Title
        name: title
        widget: string
        required: false
        hint: Optional. Leave blank to show only the date.
      - label: Publish Date
        name: pubDate
        widget: datetime
        format: 'YYYY-MM-DDTHH:mm:ss.SSSZ'
        date_format: 'YYYY-MM-DD'
        time_format: 'HH:mm'
      - { label: Draft, name: draft, widget: boolean, default: false }
      - label: Body
        name: body
        widget: markdown
        modes: [raw, rich_text]

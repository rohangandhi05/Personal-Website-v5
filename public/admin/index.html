<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Writing Desk — Rohan Gandhi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ─── Theme tokens (mirror the public site) ──────────── */
      :root {
        --bg: #ffffff;
        --text: #222222;
        --muted: #8a8a8f;
        --accent: #111111;
        --accent-contrast: #ffffff;
        --border: #e9e9e9;
        --hairline: rgba(0, 0, 0, 0.08);
        --serif: 'EB Garamond', Georgia, serif;
        --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
      }

      [data-theme='dark'] {
        --bg: #1a1a1a;
        --text: #ffffff;
        --muted: #9a9a9a;
        --accent: #ffffff;
        --accent-contrast: #1a1a1a;
        --border: #333333;
        --hairline: rgba(255, 255, 255, 0.12);
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* ─── Splash ─────────────────────────────────────────── */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            60% 55% at 50% 38%,
            var(--hairline),
            transparent 70%
          ),
          var(--bg);
        transition:
          opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0.6s;
      }

      #splash.out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .mark {
        color: var(--text);
        opacity: 0;
        animation: rise 0.9s 0.05s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      .mark svg {
        width: 34px;
        height: 34px;
        display: block;
      }

      .wordmark {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 2.5rem;
        line-height: 1.1;
        letter-spacing: -0.01em;
        margin-top: 1.4rem;
        opacity: 0;
        animation: rise 0.9s 0.16s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }

      .label {
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 0.85rem;
        opacity: 0;
        animation: rise 0.9s 0.26s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }

      .track {
        position: relative;
        width: 168px;
        height: 1px;
        margin-top: 2.6rem;
        background: var(--hairline);
        overflow: hidden;
        opacity: 0;
        animation: rise 0.9s 0.36s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      .track::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        background: var(--accent);
        animation: sweep 1.5s 0.8s cubic-bezier(0.5, 0, 0.2, 1) infinite;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(9px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark,
        .wordmark,
        .label,
        .track {
          animation: none;
          opacity: 1;
        }
        .track::after {
          animation: none;
        }
      }

      /* ═══════════════════════════════════════════════════════
         Decap CMS overrides — cohesive type, mono-accent, calm
         chrome. Targets semantic elements + Decap's inline
         steel-blue brand color (styled-components hash names).
         ═══════════════════════════════════════════════════════ */

      /* Base UI font */
      #nc-root,
      #nc-root [class^='css-'],
      #nc-root [class*=' css-'],
      #nc-root input,
      #nc-root textarea,
      #nc-root button,
      #nc-root select {
        font-family: var(--sans);
        letter-spacing: -0.005em;
      }

      /* Editorial serif for page/collection titles + headings */
      #nc-root h1,
      #nc-root h2,
      #nc-root [class*='CollectionTop'] h1,
      #nc-root [class*='CardHeading'],
      #nc-root [class*='EditorControl'] h2 {
        font-family: var(--serif) !important;
        font-weight: 500 !important;
        letter-spacing: -0.01em !important;
      }

      /* Recolor Decap's steel-blue (rgb 70 130 180 / #4681B2) accent */
      [style*='rgb(70, 130, 180)'],
      [style*='#4681B2'],
      [style*='#4682b4'] {
        color: var(--accent) !important;
      }
      [style*='background-color: rgb(70, 130, 180)'],
      [style*='background: rgb(70, 130, 180)'] {
        background-color: var(--accent) !important;
        color: var(--accent-contrast) !important;
      }

      /* Buttons — softened, consistent */
      #nc-root button[class] {
        border-radius: 9px !important;
        font-weight: 500 !important;
      }

      /* Inputs */
      #nc-root input[class],
      #nc-root textarea[class],
      #nc-root select[class] {
        border-radius: 9px !important;
      }

      /* Primary / publish / login buttons → solid accent pill */
      #nc-root a[href*='github'],
      #nc-root button[class*='primary'],
      #nc-root button[data-testid*='login'],
      #nc-root [class*='PublishButton'] {
        background: var(--accent) !important;
        color: var(--accent-contrast) !important;
        border: none !important;
        border-radius: 10px !important;
        font-weight: 600 !important;
        letter-spacing: 0 !important;
        box-shadow: none !important;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease !important;
      }
      #nc-root a[href*='github']:hover,
      #nc-root button[class*='primary']:hover,
      #nc-root [class*='PublishButton']:hover {
        opacity: 0.88 !important;
        transform: translateY(-1px) !important;
      }
    </style>
  </head>

  <body>
    <!-- Splash -->
    <div id="splash" role="status" aria-label="Loading the writing desk">
      <div class="mark">
        <!-- pen -->
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M4 20h4" />
          <path
            d="M16.7 3.3a1.9 1.9 0 0 1 2.7 2.7L7.5 17.9 3.5 19l1.1-4L16.7 3.3z"
          />
        </svg>
      </div>
      <h1 class="wordmark">Rohan Gandhi</h1>
      <p class="label">The Writing Desk</p>
      <div class="track" aria-hidden="true"></div>
    </div>

    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>

    <script>
      // Match the theme the visitor last chose on the public site
      // (same origin → shared localStorage), else system preference.
      ;(function () {
        const saved = localStorage.getItem('theme')
        const prefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)'
        ).matches
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()

      // Dismiss splash once the CMS has painted something meaningful
      ;(function () {
        const splash = document.getElementById('splash')
        const done = () => splash && splash.classList.add('out')

        const observer = new MutationObserver(() => {
          if (document.querySelector('#nc-root [class]')) {
            observer.disconnect()
            setTimeout(done, 450)
          }
        })
        observer.observe(document.body, { childList: true, subtree: true })

        // Hard fallback
        setTimeout(done, 5000)
      })()
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Writing Desk — Rohan Gandhi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* ─── Dark-only theme tokens ─────────────────────────── */
      :root {
        --bg: #161616; /* app canvas */
        --surface: #1f1f1f; /* cards, inputs */
        --surface-2: #262626; /* raised: menus, dialogs */
        --text: #ececec;
        --muted: #9a9a9a;
        --accent: #ffffff;
        --accent-contrast: #161616;
        --border: #333333;
        --hairline: rgba(255, 255, 255, 0.12);
        --serif: 'EB Garamond', Georgia, serif;
        --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;
        --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        color-scheme: dark;
      }

      html,
      body {
        min-height: 100%;
        background: var(--bg) !important;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* App shell must fill the viewport so no white shows below */
      #nc-root {
        min-height: 100vh !important;
        background: var(--bg) !important;
      }

      /* ─── Splash ─────────────────────────────────────────── */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            60% 55% at 50% 38%,
            var(--hairline),
            transparent 70%
          ),
          var(--bg);
        transition:
          opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0.6s;
      }

      #splash.out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .mark {
        color: var(--text);
        opacity: 0;
        animation: rise 0.9s 0.05s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      .mark svg {
        width: 34px;
        height: 34px;
        display: block;
      }

      .wordmark {
        font-family: var(--serif);
        font-weight: 500;
        font-size: 2.5rem;
        line-height: 1.1;
        letter-spacing: -0.01em;
        margin-top: 1.4rem;
        opacity: 0;
        animation: rise 0.9s 0.16s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }

      .label {
        font-family: var(--mono);
        font-size: 0.7rem;
        font-weight: 500;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 0.85rem;
        opacity: 0;
        animation: rise 0.9s 0.26s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }

      .track {
        position: relative;
        width: 168px;
        height: 1px;
        margin-top: 2.6rem;
        background: var(--hairline);
        overflow: hidden;
        opacity: 0;
        animation: rise 0.9s 0.36s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      .track::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        background: var(--accent);
        animation: sweep 1.5s 0.8s cubic-bezier(0.5, 0, 0.2, 1) infinite;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(9px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .mark,
        .wordmark,
        .label,
        .track {
          animation: none;
          opacity: 1;
        }
        .track::after {
          animation: none;
        }
      }

      /* ═══════════════════════════════════════════════════════
         Decap CMS — full dark theme.
         Strategy: paint every emotion surface OPAQUE dark (never
         transparent — transparent fixed/sticky bars let scrolled
         content show through and collide). Then raise contrast only
         where needed (inputs, menus, dialogs) and keep icons + the
         accent pill intact. Emotion class names are hashed, so we
         rely on [class*='css-'], element, role, and inline-style
         selectors with deterministic specificity.
         ═══════════════════════════════════════════════════════ */

      /* App canvas */
      #nc-root {
        background: var(--bg) !important;
        color: var(--text);
      }

      /* Blanket: opaque dark surface + light text (specificity 1,1,0) */
      #nc-root [class*='css-'] {
        background-color: var(--bg) !important;
        background-image: none !important;
        color: var(--text) !important;
        border-color: var(--border) !important;
        text-shadow: none !important;
      }

      /* Icons never paint a box, and inherit their parent's color
         (so they stay visible inside the light accent pill) */
      #nc-root svg,
      #nc-root [class*='css-'] svg,
      #nc-root [class*='css-'] svg * {
        background-color: transparent !important;
        color: inherit !important;
      }

      /* Base UI font */
      #nc-root,
      #nc-root [class*='css-'],
      #nc-root input,
      #nc-root textarea,
      #nc-root button,
      #nc-root select {
        font-family: var(--sans);
        letter-spacing: -0.005em;
      }

      /* Editorial serif for titles + headings */
      #nc-root h1,
      #nc-root h2 {
        font-family: var(--serif) !important;
        font-weight: 500 !important;
        letter-spacing: -0.01em !important;
      }

      /* Editable fields — readable raised surface (specificity 1,1,1) */
      #nc-root input[class],
      #nc-root textarea[class],
      #nc-root select[class],
      #nc-root [contenteditable='true'],
      #nc-root [class*='css-'] input,
      #nc-root [class*='css-'] textarea {
        background-color: var(--surface) !important;
        color: var(--text) !important;
        border: 1px solid var(--border) !important;
        border-radius: 9px !important;
      }
      /* Keep the rich-text body one uniform surface */
      #nc-root [contenteditable='true'] [class*='css-'] {
        background-color: transparent !important;
      }
      #nc-root input::placeholder,
      #nc-root textarea::placeholder {
        color: var(--muted) !important;
      }

      /* Raised surfaces: menus, dialogs, listboxes, tooltips (1,1,1) */
      #nc-root [role='menu'][class],
      #nc-root [role='dialog'][class],
      #nc-root [role='listbox'][class],
      #nc-root [role='tooltip'][class] {
        background-color: var(--surface-2) !important;
        border: 1px solid var(--border) !important;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.55) !important;
      }

      /* Dropdown menus must size to their widest item, not the trigger,
         and never clip their labels. Decap's emotion labels are stable
         (pinned to decap-cms@3.3.3): DropdownList, StyledMenuItem,
         ToolbarDropdown. */
      #nc-root [role='menu'][class],
      #nc-root [class*='DropdownList'] {
        width: max-content !important;
        min-width: 160px !important;
        max-width: 92vw !important;
        overflow: visible !important;
      }
      #nc-root [class*='ToolbarDropdown'],
      #nc-root [class*='Dropdown'] {
        overflow: visible !important;
      }
      #nc-root [class*='StyledMenuItem'],
      #nc-root [class*='dropdownItem'],
      #nc-root [role='menuitem'],
      #nc-root [role='menuitem'] span {
        white-space: nowrap !important;
        overflow: visible !important;
        text-overflow: clip !important;
      }

      /* Recolor Decap's steel-blue accent (inline styles) to the
         accent pill — #nc-root prefix + placed after blanket so the
         (1,1,0) tie resolves here */
      #nc-root [style*='rgb(70, 130, 180)'],
      #nc-root [style*='#4681B2'],
      #nc-root [style*='#4682b4'] {
        color: var(--accent) !important;
      }
      #nc-root [style*='background-color: rgb(70, 130, 180)'],
      #nc-root [style*='background: rgb(70, 130, 180)'] {
        background-color: var(--accent) !important;
        color: var(--accent-contrast) !important;
        border: none !important;
      }

      /* Consistent button shape */
      #nc-root button[class] {
        border-radius: 9px !important;
        font-weight: 500 !important;
      }

      /* Login (GitHub) button → accent pill */
      #nc-root a[href*='github'],
      #nc-root button[data-testid*='login'] {
        background: var(--accent) !important;
        color: var(--accent-contrast) !important;
        border: none !important;
        border-radius: 10px !important;
        font-weight: 600 !important;
        box-shadow: none !important;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease !important;
      }
      #nc-root a[href*='github']:hover,
      #nc-root button[data-testid*='login']:hover {
        opacity: 0.88 !important;
        transform: translateY(-1px) !important;
      }

      /* Dark scrollbars */
      #nc-root ::-webkit-scrollbar {
        width: 11px;
        height: 11px;
      }
      #nc-root ::-webkit-scrollbar-thumb {
        background: #3a3a3a;
        border-radius: 8px;
      }
      #nc-root ::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>

  <body>
    <!-- Splash -->
    <div id="splash" role="status" aria-label="Loading the writing desk">
      <div class="mark">
        <!-- pen -->
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M4 20h4" />
          <path
            d="M16.7 3.3a1.9 1.9 0 0 1 2.7 2.7L7.5 17.9 3.5 19l1.1-4L16.7 3.3z"
          />
        </svg>
      </div>
      <h1 class="wordmark">Rohan Gandhi</h1>
      <p class="label">The Writing Desk</p>
      <div class="track" aria-hidden="true"></div>
    </div>

    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"></script>

    <script>
      // Dismiss splash once the CMS has painted something meaningful
      ;(function () {
        const splash = document.getElementById('splash')
        const done = () => splash && splash.classList.add('out')

        const observer = new MutationObserver(() => {
          if (document.querySelector('#nc-root [class]')) {
            observer.disconnect()
            setTimeout(done, 450)
          }
        })
        observer.observe(document.body, { childList: true, subtree: true })

        // Hard fallback
        setTimeout(done, 5000)
      })()

      // Hide Decap's top "Media" tab — images are added inside the post body,
      // so the separate media library isn't needed. Class names are hashed,
      // so we match by the tab's text content and keep it hidden as the app
      // re-renders.
      ;(function () {
        const hideMedia = () => {
          document
            .querySelectorAll('#nc-root a, #nc-root button')
            .forEach((el) => {
              if ((el.textContent || '').trim() === 'Media') {
                el.style.display = 'none'
              }
            })
        }
        const mo = new MutationObserver(hideMedia)
        mo.observe(document.body, { childList: true, subtree: true })
        hideMedia()
      })()
    </script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8E8E8"/>
    </marker>
  </defs>
  <style>
    .t  { font-size: 15px; font-weight: 700; fill: #F2F2F2; text-anchor: middle; }
    .s  { font-size: 12px; fill: #9AA0A8; text-anchor: middle; }
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #C9CCD1; text-anchor: middle; }
    .n  { font-size: 12px; font-weight: 700; fill: #0B0C0E; text-anchor: middle; }
    .st { font-size: 12.5px; fill: #C9CCD1; }
    .box{ fill: #15171B; stroke: #2C3036; }
  </style>
  <rect width="900" height="330" rx="16" fill="#0B0C0E"/>

  <!-- phone -->
  <rect class="box" x="40" y="40" width="120" height="150" rx="18"/>
  <rect x="52" y="58" width="96" height="104" rx="4" fill="#1F2228"/>
  <polygon points="92,96 92,124 116,110" fill="#E8E8E8"/>
  <text class="t" x="100" y="216">Phone</text>
  <text class="s" x="100" y="234">YouTube app</text>

  <!-- DIAL server -->
  <rect class="box" x="250" y="60" width="180" height="110" rx="10"/>
  <text class="t" x="340" y="98">DIAL server</text>
  <text class="m" x="340" y="122">peer-dial + express</text>
  <text class="m" x="340" y="142">port 8569</text>
  <text class="s" x="340" y="216">inside MagicMirror's</text>
  <text class="s" x="340" y="234">node_helper</text>

  <!-- electron -->
  <rect class="box" x="520" y="60" width="160" height="110" rx="10"/>
  <text class="t" x="600" y="98">Electron window</text>
  <text class="m" x="600" y="122">user agent:</text>
  <text class="m" x="600" y="142">Samsung Tizen TV</text>
  <text class="s" x="600" y="216">separate process,</text>
  <text class="s" x="600" y="234">placed by config</text>

  <!-- youtube tv -->
  <rect class="box" x="760" y="60" width="110" height="110" rx="10"/>
  <text class="m" x="815" y="110">youtube.com</text>
  <text class="m" x="815" y="128">/tv</text>
  <text class="s" x="815" y="216">TV interface</text>
  <text class="s" x="815" y="234">pairs with phone</text>

  <!-- arrows -->
  <path d="M164,98 L244,98" stroke="#E8E8E8" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="204" cy="80" r="10" fill="#E8E8E8"/><text class="n" x="204" y="84">1</text>
  <path d="M434,115 L514,115" stroke="#E8E8E8" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="474" cy="97" r="10" fill="#E8E8E8"/><text class="n" x="474" y="101">2</text>
  <path d="M684,115 L754,115" stroke="#E8E8E8" stroke-width="1.6" marker-end="url(#ah)"/>
  <circle cx="719" cy="97" r="10" fill="#E8E8E8"/><text class="n" x="719" y="101">3</text>
  <path d="M164,140 C300,175 600,175 756,145" fill="none" stroke="#6C7178" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <circle cx="460" cy="168" r="10" fill="#6C7178"/><text class="n" x="460" y="172">4</text>

  <!-- steps -->
  <text class="st" x="40" y="276">1  The mirror shows up in the phone's cast list (DIAL discovery over the local network).</text>
  <text class="st" x="40" y="296">2  "Launch YouTube" spawns an Electron window; the two processes talk over IPC.  3  It opens YouTube's TV site.</text>
  <text class="st" x="40" y="316">4  The phone pairs with that TV session and controls playback. Stopping the cast sends QUIT over IPC.</text>
</svg>

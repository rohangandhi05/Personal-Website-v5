<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" font-family="'Helvetica Neue', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171B"/>
      <stop offset="0.55" stop-color="#050506"/>
      <stop offset="1" stop-color="#0B0C0E"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2E25"/>
      <stop offset="1" stop-color="#241B15"/>
    </linearGradient>
  </defs>
  <style>
    .clock { font-size: 64px; font-weight: 200; fill: #F2F2F2; }
    .small { font-size: 15px; font-weight: 300; fill: #8F949B; }
    .temp  { font-size: 52px; font-weight: 200; fill: #F2F2F2; text-anchor: end; }
    .right { text-anchor: end; }
    .line  { font-size: 17px; font-weight: 300; fill: #C9CCD1; text-anchor: middle; }
    .hi    { fill: #FFFFFF; font-weight: 400; }
    .tag   { font-size: 12px; fill: #6C7178; letter-spacing: 1px; }
  </style>

  <!-- frame + glass -->
  <rect x="10" y="10" width="880" height="520" rx="22" fill="url(#frame)"/>
  <rect x="34" y="34" width="832" height="472" rx="8" fill="url(#glass)"/>
  <polygon points="420,34 560,34 300,506 160,506" fill="url(#sheen)"/>

  <!-- top left: clock -->
  <text class="small" x="70" y="88">Tuesday, November 10</text>
  <text class="clock" x="66" y="150">7:42<tspan font-size="26" dx="6" fill="#8F949B">AM</tspan></text>

  <!-- top right: weather -->
  <g transform="translate(700,92)">
    <circle cx="0" cy="0" r="13" fill="none" stroke="#F2F2F2" stroke-width="2"/>
    <g stroke="#F2F2F2" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-21" x2="0" y2="-27"/><line x1="0" y1="21" x2="0" y2="27"/>
      <line x1="-21" y1="0" x2="-27" y2="0"/><line x1="21" y1="0" x2="27" y2="0"/>
      <line x1="-15" y1="-15" x2="-19" y2="-19"/><line x1="15" y1="15" x2="19" y2="19"/>
      <line x1="-15" y1="15" x2="-19" y2="19"/><line x1="15" y1="-15" x2="19" y2="-19"/>
    </g>
  </g>
  <text class="temp" x="830" y="112">9°C</text>
  <text class="small right" x="830" y="140">Clear · ↑ 07:18  ↓ 16:31</text>

  <!-- centre: the console app's briefing -->
  <text class="line" x="450" y="236"><tspan class="hi">Good morning Rohan</tspan></text>
  <text class="line" x="450" y="270">The current time is 7:42 AM and the outside weather is Clear.</text>
  <text class="line" x="450" y="298">Current topside temperature is 9 degrees Celsius.</text>
  <text class="line" x="450" y="326">Your trip to work is about 14.2 kilometers long and will take about 26 minutes.</text>
  <text class="line" x="450" y="354">If you leave now, you should arrive at approximately 8:08 AM.</text>

  <!-- bottom right: cast window -->
  <rect x="640" y="388" width="196" height="94" rx="6" fill="#111317" stroke="#2C3036"/>
  <polygon points="728,420 728,450 752,435" fill="#E8E8E8"/>
  <text class="tag" x="738" y="474" text-anchor="middle">CAST · YOUTUBE</text>

  <text class="tag" x="70" y="474">MAGICMIRROR</text>
</svg>

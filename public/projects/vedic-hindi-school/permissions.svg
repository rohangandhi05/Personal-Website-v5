<svg xmlns="http://www.w3.org/2000/svg" width="880" height="580" viewBox="0 0 880 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .lbl { font-size: 15px; fill: #2B1A12; }
    .hd  { font-size: 13px; font-weight: 700; fill: #8A3A17; letter-spacing: 1.2px; }
    .p   { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .n  { fill: #F4EEEA; } .tn { fill: #A39389; }
    .r  { fill: #FBE3D6; } .tr { fill: #8A3A17; }
    .w  { fill: #B5451B; } .tw { fill: #FFFFFF; }
    .l  { fill: #ECE8E6; } .tl { fill: #6F6762; }
    .rule { stroke: #F0E2D9; stroke-width: 1; }
    .foot { font-size: 13px; fill: #8C7B71; }
  </style>
  <rect x="0.5" y="0.5" width="879" height="579" rx="18" fill="#FFFCFA" stroke="#EAD8CC"/>

  <text x="28" y="44" font-size="20" font-weight="700" fill="#2B1A12">Who can see what</text>
  <text class="hd" x="420" y="78" text-anchor="middle">FAMILY</text>
  <text class="hd" x="600" y="78" text-anchor="middle">TEACHER</text>
  <text class="hd" x="780" y="78" text-anchor="middle">ADMIN</text>

  <!-- row 1 -->
  <line class="rule" x1="24" y1="96" x2="856" y2="96"/>
  <text class="lbl" x="28" y="125">School-wide announcements</text>
  <rect class="r" x="338" y="104" width="164" height="32" rx="16"/><text class="p tr" x="420" y="125">read</text>
  <rect class="w" x="518" y="104" width="164" height="32" rx="16"/><text class="p tw" x="600" y="125">read + post</text>
  <rect class="w" x="698" y="104" width="164" height="32" rx="16"/><text class="p tw" x="780" y="125">everything</text>

  <!-- row 2 -->
  <line class="rule" x1="24" y1="148" x2="856" y2="148"/>
  <text class="lbl" x="28" y="177">Class announcements</text>
  <rect class="r" x="338" y="156" width="164" height="32" rx="16"/><text class="p tr" x="420" y="177">read · own class</text>
  <rect class="w" x="518" y="156" width="164" height="32" rx="16"/><text class="p tw" x="600" y="177">post · own class</text>
  <rect class="w" x="698" y="156" width="164" height="32" rx="16"/><text class="p tw" x="780" y="177">everything</text>

  <!-- row 3 -->
  <line class="rule" x1="24" y1="200" x2="856" y2="200"/>
  <text class="lbl" x="28" y="229">Attendance</text>
  <rect class="r" x="338" y="208" width="164" height="32" rx="16"/><text class="p tr" x="420" y="229">read · own class</text>
  <rect class="w" x="518" y="208" width="164" height="32" rx="16"/><text class="p tw" x="600" y="229">take · own class</text>
  <rect class="w" x="698" y="208" width="164" height="32" rx="16"/><text class="p tw" x="780" y="229">everything</text>

  <!-- row 4 -->
  <line class="rule" x1="24" y1="252" x2="856" y2="252"/>
  <text class="lbl" x="28" y="281">Classes, calendar, PDFs</text>
  <rect class="r" x="338" y="260" width="164" height="32" rx="16"/><text class="p tr" x="420" y="281">read</text>
  <rect class="r" x="518" y="260" width="164" height="32" rx="16"/><text class="p tr" x="600" y="281">read</text>
  <rect class="w" x="698" y="260" width="164" height="32" rx="16"/><text class="p tw" x="780" y="281">everything</text>

  <!-- row 5 -->
  <line class="rule" x1="24" y1="304" x2="856" y2="304"/>
  <text class="lbl" x="28" y="333">User profiles</text>
  <rect class="r" x="338" y="312" width="164" height="32" rx="16"/><text class="p tr" x="420" y="333">own only</text>
  <rect class="r" x="518" y="312" width="164" height="32" rx="16"/><text class="p tr" x="600" y="333">read everyone</text>
  <rect class="w" x="698" y="312" width="164" height="32" rx="16"/><text class="p tw" x="780" y="333">everything</text>

  <!-- row 6 -->
  <line class="rule" x1="24" y1="356" x2="856" y2="356"/>
  <text class="lbl" x="28" y="385">Own role, ID, enrolment</text>
  <rect class="l" x="338" y="364" width="164" height="32" rx="16"/><text class="p tl" x="420" y="385">locked</text>
  <rect class="l" x="518" y="364" width="164" height="32" rx="16"/><text class="p tl" x="600" y="385">locked</text>
  <rect class="w" x="698" y="364" width="164" height="32" rx="16"/><text class="p tw" x="780" y="385">can change</text>

  <!-- row 7 -->
  <line class="rule" x1="24" y1="408" x2="856" y2="408"/>
  <text class="lbl" x="28" y="437">Registration IDs</text>
  <rect class="r" x="338" y="416" width="164" height="32" rx="16"/><text class="p tr" x="420" y="437">claim their own</text>
  <rect class="r" x="518" y="416" width="164" height="32" rx="16"/><text class="p tr" x="600" y="437">claim their own</text>
  <rect class="w" x="698" y="416" width="164" height="32" rx="16"/><text class="p tw" x="780" y="437">issue + revoke</text>

  <!-- row 8 -->
  <line class="rule" x1="24" y1="460" x2="856" y2="460"/>
  <text class="lbl" x="28" y="489">Push notification jobs</text>
  <rect class="n" x="338" y="468" width="164" height="32" rx="16"/><text class="p tn" x="420" y="489">none</text>
  <rect class="r" x="518" y="468" width="164" height="32" rx="16"/><text class="p tr" x="600" y="489">queue</text>
  <rect class="w" x="698" y="468" width="164" height="32" rx="16"/><text class="p tw" x="780" y="489">everything</text>
  <line class="rule" x1="24" y1="512" x2="856" y2="512"/>

  <text class="foot" x="28" y="546">Transcribed from firestore.rules. Firebase checks every read and write on the server, so a modified app can't get around it.</text>
</svg>
